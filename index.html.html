<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KIIP Счётчик"><title>KIIP — учёт часов</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light dark}body{margin:0;background:#f4f5f8;color:#17202c;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}main{max-width:560px;margin:auto;padding:20px 0 40px}h1{font-size:24px;margin:5px 0 18px}.card{background:white;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #16233c0b}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.metric{font-size:23px;font-weight:750}.bar{height:12px;background:#e8ebf1;border-radius:20px;overflow:hidden;margin:11px 0 7px}.fill{height:100%;background:#25a46b;transition:width .2s}.orange{background:#e4a03e}.muted{color:#697386;font-size:13px}.entry{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #edf0f4}.entry:last-child{border:0}.date{width:78px;flex:none;font-size:14px;font-weight:650}.date small{display:block;color:#7c8595;font-weight:400;margin-top:3px}.choices{display:flex;flex:1;gap:4px}.choices button{flex:1;border:1px solid #e0e4eb;border-radius:9px;background:#f6f7fa;color:#515d6d;padding:10px 1px;font-size:12px;cursor:pointer}.choices button.active.attended{background:#d8f4e6;border-color:#36b47c;color:#087545}.choices button.active.missed{background:#ffdfdc;border-color:#ee857d;color:#b72c25}.choices button.active.planned{background:#dce8ff;border-color:#8caff8;color:#265eb8}.controls{display:flex;align-items:center;gap:13px}.controls button{border:1px solid #dce0e7;background:#f6f7fa;color:#17202c;width:34px;height:34px;border-radius:9px;font-size:20px}footer{font-size:12px;color:#7a8392;line-height:1.5} @media(prefers-color-scheme:dark){body{background:#121820;color:#edf1f6}.card{background:#202a36}.muted,.date small,footer{color:#a5afbf}.entry{border-color:#364251}.bar{background:#394452}.choices button,.controls button{background:#2b3745;border-color:#435163;color:#e3e8f0}}</style></head><body><main><h1>KIIP · Счётчик часов</h1><section class="card"><div class="line"><strong>Посещено</strong><span class="metric" id="att">0 / 100 ч</span></div><div class="bar"><div class="fill" id="attbar"></div></div><div class="muted">Цель: минимум 80 часов</div></section><section class="card"><div class="line"><strong>Пропущено</strong><span class="metric" id="miss">0 / 20 ч</span></div><div class="bar"><div class="fill orange" id="missbar"></div></div><div class="line"><span class="muted" id="remain"></span></div></section><section class="card"><h3 style="margin:0 0 7px">Расписание</h3><div id="schedule"></div></section><footer>Отметки сохраняются автоматически в браузере этого устройства. Пропуски считаются только по датам со статусом «Пропустил». Для надёжности не удаляй данные сайта. Файл можно использовать без интернета.</footer></main><script>const dates=['05.09','12.09','19.09','10.10','17.10','24.10','31.10','07.11','14.11','21.11','28.11','05.12','12.12'];const hours=dates.map((_,i)=>i===12?4:8);let state;try{state=JSON.parse(localStorage.getItem('kiip-counter-v1'))}catch(e){}if(!state||!Array.isArray(state.statuses)||state.statuses.length!==13)state={statuses:dates.map((_,i)=>i<6?'attended':'planned'),};function save(){localStorage.setItem('kiip-counter-v1',JSON.stringify(state))}function setStatus(i,v){state.statuses[i]=v;save();render()}function render(){const a=hours.reduce((s,h,i)=>s+(state.statuses[i]==='attended'?h:0),0);const m=hours.reduce((s,h,i)=>s+(state.statuses[i]==='missed'?h:0),0);document.getElementById('att').textContent=a+' / 100 ч';document.getElementById('miss').textContent=m+' / 20 ч';document.getElementById('attbar').style.width=Math.min(100,a)+'%';document.getElementById('missbar').style.width=Math.min(100,m/20*100)+'%';document.getElementById('missbar').style.background=m>20?'#e74e4e':'#e4a03e';document.getElementById('remain').textContent=m>20?'Превышение на '+(m-20)+' ч':'Можно пропустить ещё '+(20-m)+' ч';document.getElementById('schedule').innerHTML=dates.map((d,i)=>'<div class="entry"><div class="date">'+d+'.2026<small>'+hours[i]+' часов</small></div><div class="choices">'+[['attended','Посетил'],['missed','Пропустил'],['planned','План']].map(([v,label])=>'<button class="'+v+(state.statuses[i]===v?' active':'')+'" onclick="setStatus('+i+',\''+v+'\')">'+label+'</button>').join('')+'</div></div>').join('')}render();</script></body></html>
